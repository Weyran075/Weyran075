<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tag Game vs Bot</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #111;
    }

    canvas {
      display: block;
      background: #222;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="800" height="600"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Player en bot setup
    const player = {
      x: 100,
      y: 100,
      size: 30,
      speed: 5,
      color: 'dodgerblue'
    };

    const bot = {
      x: 700,
      y: 500,
      size: 30,
      speed: 2.5,
      color: 'crimson'
    };

    // Input (pijltjestoetsen of WASD)
    const keys = {};
    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);

    function update() {
      // Beweging speler
      if (keys['ArrowUp'] || keys['w']) player.y -= player.speed;
      if (keys['ArrowDown'] || keys['s']) player.y += player.speed;
      if (keys['ArrowLeft'] || keys['a']) player.x -= player.speed;
      if (keys['ArrowRight'] || keys['d']) player.x += player.speed;

      // Grenzen
      player.x = Math.max(0, Math.min(canvas.width - player.size, player.x));
      player.y = Math.max(0, Math.min(canvas.height - player.size, player.y));

      // Bot AI (move towards player)
      const dx = player.x - bot.x;
      const dy = player.y - bot.y;
      const dist = Math.hypot(dx, dy);

      if (dist > 1) {
        bot.x += (dx / dist) * bot.speed;
        bot.y += (dy / dist) * bot.speed;
      }

      // Check collision (TIKKIE!)
      if (
        player.x < bot.x + bot.size &&
        player.x + player.size > bot.x &&
        player.y < bot.y + bot.size &&
        player.y + player.size > bot.y
      ) {
        alert("GOTCHA 💀 De bot heeft je getikt!");
        resetGame();
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Player tekenen
      ctx.fillStyle = player.color;
      ctx.fillRect(player.x, player.y, player.size, player.size);

      // Bot tekenen
      ctx.fillStyle = bot.color;
      ctx.fillRect(bot.x, bot.y, bot.size, bot.size);
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    function resetGame() {
      player.x = 100;
      player.y = 100;
      bot.x = 700;
      bot.y = 500;
    }

    gameLoop(); // LET'S GOOOO 🎮
  </script>
</body>
</html>
